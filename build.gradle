plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java {
			srcDir 'src/main/generated/java'
		}
	}
}

// Self-heal at configuration time (before sourcesJar / compileJava / jar): SimPlayerState is a
// GENERATED class (emitted into src/main/generated/java by :analysis:generateBridge). A stale
// hand-written copy in src/main/java — left over from before codegen, or from a partial sync of
// untracked files — collides with the generated one as a duplicate source entry and breaks the
// build (e.g. sourcesJar "duplicate" / javac "duplicate class"). Remove it so the build is robust.
def legacySimPlayerState = file('src/main/java/murat/simv2/sim/SimPlayerState.java')
if (legacySimPlayerState.exists()) {
	legacySimPlayerState.delete()
	logger.lifecycle("Removed stale hand-written ${legacySimPlayerState} " +
		"(SimPlayerState is generated into src/main/generated/java).")
}

repositories {

}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {

	}
}

// The real->sim bridge (SimPlayerState + PlayerStateCapture) is generated from the movement-field
// manifest. Regenerate it before compiling so the generated sources always exist and are current
// (no reliance on committing/syncing generated code; the generator also self-heals any stale
// hand-written copy). generateBridge is fast (parses the committed manifest; no WALA run).
tasks.named('compileJava') {
	dependsOn ':analysis:generateBridge'
}

tasks.register('runWala') {
	group = 'application'
	description = 'Alias for :analysis:runWala.'
	dependsOn ':analysis:runWala'
}

tasks.register('stripJar') {
	group = 'application'
	description = 'Alias for :analysis:stripJar.'
	dependsOn ':analysis:stripJar'
}
