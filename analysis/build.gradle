plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.ibm.wala:com.ibm.wala.core:1.6.9'
    implementation 'com.ibm.wala:com.ibm.wala.util:1.6.9'
    implementation 'com.ibm.wala:com.ibm.wala.shrike:1.6.9'
    implementation 'fr.inria.gforge.spoon:spoon-core:11.1.0'
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

application {
    mainClass = 'murat.simv2.analysis.MovementFieldAnalyzer'
}

def analysisXmx = (project.findProperty('analysisXmx') ?: '64g').toString()
def analysisVerboseFixedPoint = (project.findProperty('analysisVerboseFixedPoint') ?: 'false')
    .toString()
    .toBoolean()
def analysisDisableBytecodeVerify = (project.findProperty('analysisDisableBytecodeVerify') ?: 'false')
    .toString()
    .toBoolean()
def analysisJvmArgs = ['-Xmx' + analysisXmx, '-XX:+UseParallelGC']
if (analysisDisableBytecodeVerify) {
    analysisJvmArgs.add('-noverify')
}
if (analysisVerboseFixedPoint) {
    analysisJvmArgs.add('-Dcom.ibm.wala.fixedpoint.impl.verbose=true')
}

def analysisCacheSearchRoots = [
    file("${rootProject.projectDir}/.gradle/loom-cache"),
    file("${rootProject.projectDir}/.gradle/caches/fabric-loom"),
    file("${rootProject.projectDir}/.gradle"),
    file("${gradle.gradleUserHomeDir}/caches/fabric-loom"),
    file("${gradle.gradleUserHomeDir}/loom-cache"),
    file("${gradle.gradleUserHomeDir}/caches")
].collect { it.canonicalFile }
 .toSet()
 .toList()

def resolveAnalysisArgs = { String mode ->
    // Find merged jars across possible Loom cache layouts.
    def mergedCandidates = new LinkedHashSet<File>()
    analysisCacheSearchRoots.findAll { it.exists() }.each { cacheRoot ->
        fileTree(cacheRoot) {
            include '**/minecraft-merged-*/**/*.jar'
        }.files.each { candidate ->
            if (candidate.name.endsWith('.jar') && !candidate.name.contains('backup')) {
                mergedCandidates << candidate
            }
        }
    }

    def mergedJars = []
    def mergedSources = []
    def jarsByParent = [:].withDefault { [] }
    mergedCandidates.each { candidate ->
        jarsByParent[candidate.parentFile] << candidate
        if (candidate.name.endsWith('-sources.jar')) {
            mergedSources << candidate
        } else {
            mergedJars << candidate
        }
    }

    def newestByModified = { List<File> files ->
        files.isEmpty() ? null : files.max { it.lastModified() }
    }

    def pairedSelection = jarsByParent.values()
        .collect { siblings ->
            def mainJar = newestByModified(siblings.findAll { !it.name.endsWith('-sources.jar') })
            def sourcesJar = newestByModified(siblings.findAll { it.name.endsWith('-sources.jar') })
            if (mainJar != null && sourcesJar != null) {
                return [
                    jar: mainJar,
                    sources: sourcesJar,
                    modified: Math.max(mainJar.lastModified(), sourcesJar.lastModified())
                ]
            }
            return null
        }
        .findAll { it != null }
        .max { it.modified }

    def selectedJar = pairedSelection?.jar ?: newestByModified(mergedJars)
    def selectedSources = pairedSelection?.sources
    if (selectedJar != null) {
        def expectedName = selectedJar.name.replaceFirst(/\.jar$/, '-sources.jar')
        selectedSources = selectedJar.parentFile
            .listFiles()
            ?.find { it.isFile() && it.name == expectedName }
    }
    if (selectedSources == null) {
        selectedSources = newestByModified(mergedSources)
    }

    def defaultMcJar = selectedJar?.absolutePath ?: ""
    def defaultOutputDir = file("${rootProject.projectDir}/src/main/generated").absolutePath
    def defaultSourcesJar = selectedSources?.absolutePath ?: (mode == 'wala' ? '-' : '')

    return [
        project.findProperty('mcJar') ?: defaultMcJar,
        project.findProperty('outputDir') ?: defaultOutputDir,
        project.findProperty('sourcesJar') ?: defaultSourcesJar,
        mode
    ]
}

def configureAnalysisExec = { JavaExec execTask, String mode ->
    execTask.jvmArgs = analysisJvmArgs
    execTask.doFirst {
        def resolvedArgs = resolveAnalysisArgs(mode)
        def minecraftJarArg = (resolvedArgs[0] ?: "").toString()
        if (minecraftJarArg.isBlank()) {
            def searchedRoots = analysisCacheSearchRoots
                .findAll { it.exists() }
                .collect { it.absolutePath }
                .join(', ')
            throw new GradleException(
                "Could not resolve a Minecraft merged JAR for analysis. "
                    + "Checked cache roots: ${searchedRoots}. "
                    + "Pass -PmcJar=<path-to-minecraft-merged.jar>.")
        }
        def minecraftJar = file(minecraftJarArg)
        if (!minecraftJar.exists() || !minecraftJar.isFile()) {
            throw new GradleException(
                "Minecraft merged JAR not found: ${minecraftJar}. "
                    + "Pass -PmcJar=<path-to-minecraft-merged.jar>.")
        }
        if (mode == 'all' || mode == 'spoon') {
            def sourcesJarArg = (resolvedArgs[2] ?: "").toString()
            if (sourcesJarArg.isBlank() || sourcesJarArg == '-') {
                throw new GradleException(
                    "Could not resolve a Minecraft sources JAR for analysis mode '${mode}'. "
                        + "Pass -PsourcesJar=<path-to-minecraft-merged-sources.jar>.")
            }
            def sourcesJar = file(sourcesJarArg)
            if (!sourcesJar.exists() || !sourcesJar.isFile()) {
                throw new GradleException(
                    "Minecraft sources JAR not found: ${sourcesJar}. "
                        + "Pass -PsourcesJar=<path-to-minecraft-merged-sources.jar>.")
            }
        }
        if (mode == 'spoon') {
            def outputDir = file(resolvedArgs[1])
            def required = ['movement-slice.json', 'mirror-closure.json',
                            'movement-fields.txt']
            def missing = required.findAll { !outputDir.toPath().resolve(it).toFile().exists() }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "runSpoon requires WALA artifacts in ${outputDir}: ${missing.join(', ')}. "
                        + "Run :analysis:runWala first or set -PoutputDir accordingly.")
            }
        }
        execTask.setArgs(resolvedArgs)
    }
}

tasks.named('run', JavaExec) { JavaExec runTask ->
    configureAnalysisExec(runTask, 'all')
}

tasks.register('runWala', JavaExec) { JavaExec walaTask ->
    group = 'application'
    description = 'Run only the WALA analysis/codegen phase.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    configureAnalysisExec(walaTask, 'wala')
}

tasks.register('runSpoon', JavaExec) { JavaExec spoonTask ->
    group = 'application'
    description = 'Run only the Spoon/runtime-generation phase using existing WALA artifacts.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    configureAnalysisExec(spoonTask, 'spoon')
    mustRunAfter 'runWala'
}

tasks.register('runFullAnalysis') {
    group = 'application'
    description = 'Run WALA and Spoon phases sequentially with validated artifacts.'
    dependsOn 'runWala', 'runSpoon'
}
